<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 380" width="200" height="380">
  <!-- Top-down sports car view -->
  
  <!-- Car body shadow -->
  <ellipse cx="100" cy="195" rx="62" ry="160" fill="#000000" opacity="0.3" transform="translate(5,8)"/>
  
  <!-- Main car body -->
  <path d="M100 15 C75 15 55 35 50 65 L42 140 L38 200 L42 270 L50 310 C55 340 75 365 100 365 C125 365 145 340 150 310 L158 270 L162 200 L158 140 L150 65 C145 35 125 15 100 15Z" fill="#1a1a2e"/>
  
  <!-- Car outer body outline -->
  <path d="M100 20 C77 20 58 38 53 67 L45 142 L41 200 L45 268 L53 308 C58 338 77 360 100 360 C123 360 142 338 147 308 L155 268 L159 200 L155 142 L147 67 C142 38 123 20 100 20Z" fill="none" stroke="#2d2d4e" stroke-width="1.5"/>

  <!-- Hood / Front section -->
  <path d="M100 20 C82 20 65 34 60 55 L55 90 L145 90 L140 55 C135 34 118 20 100 20Z" fill="#16213e"/>
  
  <!-- Front bumper detail -->
  <path d="M68 28 L132 28 L138 48 L62 48Z" fill="#0f3460" rx="4"/>
  <rect x="72" y="30" width="56" height="3" rx="1.5" fill="#e94560" opacity="0.8"/>
  
  <!-- Front air intakes -->
  <rect x="66" y="52" width="18" height="8" rx="3" fill="#060606"/>
  <rect x="116" y="52" width="18" height="8" rx="3" fill="#060606"/>
  
  <!-- Front headlights (vivid) -->
  <path d="M56 35 L78 35 L80 50 L54 50Z" fill="#1a1a2e"/>
  <path d="M60 37 L74 37 L76 48 L58 48Z" fill="#e2e8f0" opacity="0.9"/>
  <!-- Headlight DRL strip -->
  <path d="M61 38 L73 38 L74 43 L60 43Z" fill="#4ade80" opacity="0.85"/>
  
  <path d="M144 35 L122 35 L120 50 L146 50Z" fill="#1a1a2e"/>
  <path d="M140 37 L126 37 L124 48 L142 48Z" fill="#e2e8f0" opacity="0.9"/>
  <path d="M139 38 L127 38 L126 43 L140 43Z" fill="#4ade80" opacity="0.85"/>
  
  <!-- Hood lines -->
  <path d="M80 55 L82 88" stroke="#0f3460" stroke-width="1.5" fill="none"/>
  <path d="M120 55 L118 88" stroke="#0f3460" stroke-width="1.5" fill="none"/>
  <path d="M100 22 L100 88" stroke="#0f3460" stroke-width="1" fill="none" opacity="0.5"/>

  <!-- Windshield -->
  <path d="M68 92 L132 92 L136 130 L64 130Z" fill="#1e3a5f" opacity="0.85"/>
  <path d="M72 95 L128 95 L132 127 L68 127Z" fill="#2a4a7f" opacity="0.6"/>
  <!-- Windshield reflections -->
  <path d="M76 98 L105 98 L108 124 L73 124Z" fill="white" opacity="0.06"/>
  <line x1="100" y1="94" x2="100" y2="129" stroke="#1a3055" stroke-width="1.5"/>
  
  <!-- A-pillars -->
  <path d="M64 92 L68 130" stroke="#101030" stroke-width="4" stroke-linecap="round"/>
  <path d="M136 92 L132 130" stroke="#101030" stroke-width="4" stroke-linecap="round"/>

  <!-- Roof / Cabin -->
  <path d="M64 130 L136 130 L138 220 L62 220Z" fill="#12122a"/>
  <!-- Roof center line -->
  <line x1="100" y1="131" x2="100" y2="220" stroke="#0a0a1a" stroke-width="2"/>
  <!-- Door windows visible -->
  <path d="M64 135 L82 135 L82 215 L64 215Z" fill="#16213e" opacity="0.7"/>
  <path d="M136 135 L118 135 L118 215 L136 215Z" fill="#16213e" opacity="0.7"/>
  
  <!-- Rear windshield -->
  <path d="M68 222 L132 222 L136 255 L64 255Z" fill="#1e3a5f" opacity="0.85"/>
  <path d="M72 225 L128 225 L131 252 L69 252Z" fill="#2a4a7f" opacity="0.6"/>
  <path d="M74 228 L103 228 L105 250 L72 250Z" fill="white" opacity="0.06"/>
  <line x1="100" y1="223" x2="100" y2="255" stroke="#1a3055" stroke-width="1.5"/>

  <!-- C-pillars -->
  <path d="M64 218 L68 255" stroke="#101030" stroke-width="4" stroke-linecap="round"/>
  <path d="M136 218 L132 255" stroke="#101030" stroke-width="4" stroke-linecap="round"/>

  <!-- Trunk section -->
  <path d="M64 258 L136 258 L140 295 L60 295Z" fill="#16213e"/>
  <!-- Trunk details -->
  <path d="M72 265 L128 265 L130 290 L70 290Z" fill="#0f1a2e" rx="4"/>
  <line x1="100" y1="259" x2="100" y2="294" stroke="#0a1220" stroke-width="1.5"/>

  <!-- Rear spoiler / diffuser -->
  <path d="M58 295 L142 295 L148 318 L52 318Z" fill="#0f3460"/>
  <!-- Spoiler wing highlights -->
  <rect x="60" y="296" width="80" height="3" rx="1.5" fill="#4ade80" opacity="0.7"/>

  <!-- Rear taillights -->
  <path d="M52 300 L74 300 L74 316 L50 316Z" fill="#1a1a2e"/>
  <path d="M56 302 L72 302 L72 314 L54 314Z" fill="#dc2626" opacity="0.9"/>
  <path d="M57 303 L68 303 L68 313 L56 313Z" fill="#ef4444" opacity="0.7"/>
  
  <path d="M148 300 L126 300 L126 316 L150 316Z" fill="#1a1a2e"/>
  <path d="M144 302 L128 302 L128 314 L146 314Z" fill="#dc2626" opacity="0.9"/>
  <path d="M143 303 L132 303 L132 313 L144 313Z" fill="#ef4444" opacity="0.7"/>

  <!-- Rear bumper -->
  <path d="M60 318 L140 318 L136 340 L64 340Z" fill="#16213e"/>
  <rect x="68" y="322" width="64" height="4" rx="2" fill="#0f1a2e"/>
  <!-- Exhaust pipes -->
  <ellipse cx="78" cy="334" rx="8" ry="4" fill="#060606"/>
  <ellipse cx="78" cy="334" rx="6" ry="3" fill="#1a1a2e"/>
  <ellipse cx="122" cy="334" rx="8" ry="4" fill="#060606"/>
  <ellipse cx="122" cy="334" rx="6" ry="3" fill="#1a1a2e"/>
  
  <!-- Rear diffuser -->
  <path d="M64 340 L136 340 L130 360 L70 360Z" fill="#0f3460" opacity="0.8"/>

  <!-- WHEELS -->
  <!-- Front Left Wheel -->
  <ellipse cx="42" cy="100" rx="18" ry="22" fill="#060606"/>
  <ellipse cx="42" cy="100" rx="14" ry="18" fill="#111111"/>
  <ellipse cx="42" cy="100" rx="10" ry="13" fill="#1a1a1a"/>
  <!-- Wheel spokes -->
  <line x1="42" y1="87" x2="42" y2="113" stroke="#2a2a2a" stroke-width="2"/>
  <line x1="29" y1="100" x2="55" y2="100" stroke="#2a2a2a" stroke-width="2"/>
  <line x1="32" y1="89" x2="52" y2="111" stroke="#2a2a2a" stroke-width="1.5"/>
  <line x1="52" y1="89" x2="32" y2="111" stroke="#2a2a2a" stroke-width="1.5"/>
  <ellipse cx="42" cy="100" rx="4" ry="5" fill="#333"/>
  <ellipse cx="42" cy="100" rx="2" ry="2.5" fill="#4ade80" opacity="0.6"/>

  <!-- Front Right Wheel -->
  <ellipse cx="158" cy="100" rx="18" ry="22" fill="#060606"/>
  <ellipse cx="158" cy="100" rx="14" ry="18" fill="#111111"/>
  <ellipse cx="158" cy="100" rx="10" ry="13" fill="#1a1a1a"/>
  <line x1="158" y1="87" x2="158" y2="113" stroke="#2a2a2a" stroke-width="2"/>
  <line x1="145" y1="100" x2="171" y2="100" stroke="#2a2a2a" stroke-width="2"/>
  <line x1="148" y1="89" x2="168" y2="111" stroke="#2a2a2a" stroke-width="1.5"/>
  <line x1="168" y1="89" x2="148" y2="111" stroke="#2a2a2a" stroke-width="1.5"/>
  <ellipse cx="158" cy="100" rx="4" ry="5" fill="#333"/>
  <ellipse cx="158" cy="100" rx="2" ry="2.5" fill="#4ade80" opacity="0.6"/>

  <!-- Rear Left Wheel -->
  <ellipse cx="42" cy="280" rx="18" ry="22" fill="#060606"/>
  <ellipse cx="42" cy="280" rx="14" ry="18" fill="#111111"/>
  <ellipse cx="42" cy="280" rx="10" ry="13" fill="#1a1a1a"/>
  <line x1="42" y1="267" x2="42" y2="293" stroke="#2a2a2a" stroke-width="2"/>
  <line x1="29" y1="280" x2="55" y2="280" stroke="#2a2a2a" stroke-width="2"/>
  <line x1="32" y1="269" x2="52" y2="291" stroke="#2a2a2a" stroke-width="1.5"/>
  <line x1="52" y1="269" x2="32" y2="291" stroke="#2a2a2a" stroke-width="1.5"/>
  <ellipse cx="42" cy="280" rx="4" ry="5" fill="#333"/>
  <ellipse cx="42" cy="280" rx="2" ry="2.5" fill="#4ade80" opacity="0.6"/>

  <!-- Rear Right Wheel -->
  <ellipse cx="158" cy="280" rx="18" ry="22" fill="#060606"/>
  <ellipse cx="158" cy="280" rx="14" ry="18" fill="#111111"/>
  <ellipse cx="158" cy="280" rx="10" ry="13" fill="#1a1a1a"/>
  <line x1="158" y1="267" x2="158" y2="293" stroke="#2a2a2a" stroke-width="2"/>
  <line x1="145" y1="280" x2="171" y2="280" stroke="#2a2a2a" stroke-width="2"/>
  <line x1="148" y1="269" x2="168" y2="291" stroke="#2a2a2a" stroke-width="1.5"/>
  <line x1="168" y1="269" x2="148" y2="291" stroke="#2a2a2a" stroke-width="1.5"/>
  <ellipse cx="158" cy="280" rx="4" ry="5" fill="#333"/>
  <ellipse cx="158" cy="280" rx="2" ry="2.5" fill="#4ade80" opacity="0.6"/>

  <!-- Side skirts -->
  <rect x="36" y="132" width="8" height="115" rx="3" fill="#0f1a2e"/>
  <rect x="156" y="132" width="8" height="115" rx="3" fill="#0f1a2e"/>
  <!-- Side skirt green accent -->
  <rect x="36" y="134" width="8" height="4" rx="2" fill="#4ade80" opacity="0.5"/>
  <rect x="156" y="134" width="8" height="4" rx="2" fill="#4ade80" opacity="0.5"/>
  
  <!-- Door handles -->
  <rect x="44" y="175" width="12" height="3" rx="1.5" fill="#2a3a5a"/>
  <rect x="144" y="175" width="12" height="3" rx="1.5" fill="#2a3a5a"/>
  
  <!-- Center console visible through roof -->
  <rect x="93" y="145" width="14" height="65" rx="3" fill="#0a0a1a"/>
  
  <!-- Green underglow accent strips -->
  <path d="M52 155 L52 225" stroke="#4ade80" stroke-width="1.5" opacity="0.3" stroke-dasharray="4 4"/>
  <path d="M148 155 L148 225" stroke="#4ade80" stroke-width="1.5" opacity="0.3" stroke-dasharray="4 4"/>
</svg>
